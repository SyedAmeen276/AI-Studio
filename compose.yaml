name: ai-content-studio
services:
  ollama:
    image: ollama/ollama:latest
    container_name: acs-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [ai-studio]
  content-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acs-content-engine
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./app:/workspace/app
      - ./output:/workspace/output
    depends_on: [ollama]
    networks: [ai-studio]
  kokoro:
    platform: linux/amd64
    image: hangrylabs/kokorotts:v1.0@sha256:5afef5b9f3d779e56248992274d46a66c0715110eb09e47e1332c39951361f24
    container_name: acs-kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - kokoro_data:/app/persistent
    networks: [ai-studio]

networks:
  ai-studio:
    driver: bridge
volumes:
  kokoro_data:
  ollama_data:
